<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0004"/>
      <stop offset="100%" stop-color="#1a0007"/>
    </linearGradient>

    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc143c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#dc143c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b0000" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#8b0000" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>

    <clipPath id="frame">
      <rect width="900" height="260" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- base -->
    <rect width="900" height="260" fill="url(#bg)"/>

    <!-- color blobs -->
    <circle cx="150" cy="60" r="180" fill="url(#blob1)" filter="url(#blur1)"/>
    <circle cx="780" cy="220" r="220" fill="url(#blob2)" filter="url(#blur2)"/>
    <circle cx="500" cy="180" r="150" fill="url(#blob1)" filter="url(#blur2)" opacity="0.5"/>

    <!-- grain overlay -->
    <rect width="900" height="260" filter="url(#grain)" opacity="0.35" style="mix-blend-mode:overlay"/>

    <!-- content -->
    <text x="450" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
          font-size="40" font-weight="700" fill="#ffffff">Hey there! 👋</text>
  </g>
</svg>
